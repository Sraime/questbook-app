name: Publish to Play Store and TestFlight

# Testers already received this build via Firebase (merge `dev` → `main`,
# tag `v<version>`). Publishing a GitHub Release from that tag is the
# "send it to the stores" gesture. `workflow_dispatch` is the same path
# without creating a Release, useful for a retry.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  QUESTBOOK_API_URL: "https://questbook.nextuscorp.com"
  QUESTBOOK_GOOGLE_SERVER_CLIENT_ID: "56734402863-bugmvgqggfhi7g0nv02o7c0uv1uarajf.apps.googleusercontent.com"

jobs:
  version:
    name: Vérifier la version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Confirm this version was already sent to testers
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if [ -n "${{ github.event.release.tag_name }}" ] && [ "${{ github.event.release.tag_name }}" != "$tag" ]; then
            echo "::error::La Release ${{ github.event.release.tag_name }} ne correspond pas à pubspec.yaml ($tag)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag n'existe pas. Merger vers main d'abord : la distribution testeurs pose ce tag."
            exit 1
          fi
          echo "Version à publier sur les stores : $version"

  android:
    name: Play Console (piste interne)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --dart-define=QUESTBOOK_API_URL="$QUESTBOOK_API_URL" \
            --dart-define=QUESTBOOK_GOOGLE_SERVER_CLIENT_ID="$QUESTBOOK_GOOGLE_SERVER_CLIENT_ID"

      - name: Require the Play Console service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON manquant. Voir le README, section Publication sur les stores."
            exit 1
          fi

      - name: Upload to Play Console internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.questbook.questbook
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          changesNotSentForReview: true

      - name: Clean up signing secrets from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

  ios:
    name: TestFlight
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install the App Store certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          APPSTORE_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ] || [ -z "$APPSTORE_PROVISION_PROFILE_BASE64" ]; then
            echo "::error::Secrets iOS store manquants (IOS_BUILD_CERTIFICATE_BASE64, IOS_P12_PASSWORD, IOS_APPSTORE_PROVISION_PROFILE_BASE64)."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/appstore_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$APPSTORE_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          TEAM_ID="$TEAM_ID" PROFILE_NAME="$PROFILE_NAME" EXPORT_OPTIONS="$EXPORT_OPTIONS" \
            python3 -c "import os,plistlib; plistlib.dump({'method':'app-store','teamID':os.environ['TEAM_ID'],'signingStyle':'manual','compileBitcode':False,'uploadSymbols':True,'provisioningProfiles':{'com.questbook.questbook':os.environ['PROFILE_NAME']}}, open(os.environ['EXPORT_OPTIONS'],'wb'))"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"

          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "DEVELOPMENT_TEAM=${TEAM_ID}"
            echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
          } >> ios/Flutter/Release.xcconfig

      - name: Build App Store IPA
        run: |
          flutter build ipa --release \
            --export-options-plist="$EXPORT_OPTIONS" \
            --dart-define=QUESTBOOK_API_URL="$QUESTBOOK_API_URL" \
            --dart-define=QUESTBOOK_GOOGLE_SERVER_CLIENT_ID="$QUESTBOOK_GOOGLE_SERVER_CLIENT_ID"

      - name: Locate the IPA
        id: ipa
        run: |
          ipa=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          uses-non-exempt-encryption: false

      - name: Clean up keychain and signing files
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/appstore_pp.mobileprovision"
