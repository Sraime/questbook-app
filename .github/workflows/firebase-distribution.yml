name: Build & distribute Android (Firebase App Distribution)

# Deliberately NOT triggered on every push — only when a pull request into
# `main` is actually merged (git-flow: `dev` is the working branch, `main`
# is release-only), or manually from the Actions tab.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this build"
        required: false
        default: "Build manuel depuis GitHub Actions"

env:
  FIREBASE_APP_ID: "1:56734402863:android:8f12f08f8eff13a8e2b9da"
  FIREBASE_PROJECT_ID: "questbook-48540"

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    # `pull_request: closed` fires on both merged AND declined/closed PRs —
    # skip the whole job unless it was actually merged (manual runs always go).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "testeurs" \
            --release-notes "${{ github.event.inputs.release_notes || format('PR #{0} mergee : {1}', github.event.pull_request.number, github.event.pull_request.title) }}" \
            --token "$FIREBASE_TOKEN"

      - name: Clean up signing secrets from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
