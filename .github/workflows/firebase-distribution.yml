name: Build & distribute (Firebase App Distribution)

# Deliberately NOT triggered on every push — only when a pull request into
# `main` is actually merged (git-flow: `dev` is the working branch, `main`
# is release-only), or manually from the Actions tab.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes for this build"
        required: false
        default: "Build manuel depuis GitHub Actions"

env:
  FIREBASE_ANDROID_APP_ID: "1:56734402863:android:8f12f08f8eff13a8e2b9da"
  FIREBASE_IOS_APP_ID: "1:56734402863:ios:b0ba4650fb4476f3e2b9da"
  FIREBASE_PROJECT_ID: "questbook-48540"
  # Injectés au build via --dart-define (voir lib/config/app_config.dart).
  # Sans eux le binaire est hors ligne : ni connexion, ni synchronisation.
  # Ce ne sont pas des secrets — l'identifiant client est de toute façon
  # embarqué en clair dans l'APK/IPA, ce qui est le modèle prévu par Google.
  QUESTBOOK_API_URL: "https://questbook.nextuscorp.com"
  QUESTBOOK_GOOGLE_SERVER_CLIENT_ID: "56734402863-bugmvgqggfhi7g0nv02o7c0uv1uarajf.apps.googleusercontent.com"

jobs:
  version:
    name: Vérifier la version
    runs-on: ubuntu-latest
    # `pull_request: closed` fires on both merged AND declined/closed PRs —
    # skip the whole job unless it was actually merged (manual runs always go).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      value: ${{ steps.version.outputs.value }}
      notes: ${{ steps.notes.outputs.value }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Les tags servent de registre des versions deja distribuees.
          fetch-depth: 0

      # Deux distributions sous le meme numero sont indiscernables pour un
      # testeur, et laissent le versionCode Android en arriere. Le tag pose en
      # fin de job fait foi : s'il existe deja, on saute (succès) plutôt que
      # d'échouer — un merge docs/CI vers main ne doit pas casser la release.
      - name: Verify the version has not been distributed yet
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "La version $version a déjà été distribuée : pas de nouveau build testeurs."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version a distribuer : $version"
          fi

      # Le testeur ne lit que ceci, et c'est a partir de la qu'il decide quoi
      # aller essayer. Le corps de la PR est deja l'endroit ou l'on ecrit ce
      # qui change : le recopier ailleurs condamnerait les deux a diverger.
      - name: Compose release notes
        id: notes
        env:
          MANUAL_NOTES: ${{ github.event.inputs.release_notes }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$MANUAL_NOTES" ]; then
            notes="$MANUAL_NOTES"
          elif [ -n "$PR_BODY" ]; then
            notes="$(printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY")"
          else
            notes="PR #${PR_NUMBER} mergee : ${PR_TITLE}"
          fi
          # Firebase plafonne la note ; un corps demesure ferait echouer la
          # distribution apres quarante minutes de build, pour un texte.
          limit=16000
          if [ "${#notes}" -gt "$limit" ]; then
            notes="$(printf '%s\n\n%s' \
              "$(printf '%s' "$notes" | cut -c1-"$limit")" \
              "(note tronquee, la suite est dans la PR #${PR_NUMBER})")"
          fi
          # Le delimiteur est tire au sort : un corps de PR qui contiendrait la
          # ligne du delimiteur fixe couperait la sortie en deux.
          delim="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "value<<$delim"
            echo "$notes"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build Android
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=QUESTBOOK_API_URL="$QUESTBOOK_API_URL" \
            --dart-define=QUESTBOOK_GOOGLE_SERVER_CLIENT_ID="$QUESTBOOK_GOOGLE_SERVER_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Clean up signing secrets from runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

  ios:
    name: Build iOS
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      # Certificat Apple Distribution (.p12). Le mot de passe du keychain
      # temporaire n'a pas besoin d'etre un secret : il ne vit que le temps
      # du job sur un runner jete ensuite.
      - name: Install the Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "::error::Secrets iOS manquants (IOS_BUILD_CERTIFICATE_BASE64, IOS_P12_PASSWORD). Voir le README."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Un IPA Ad Hoc ne s'installe que sur les appareils listes dans son
      # profil. Firebase collecte l'UDID des testeurs mais ne les declare pas
      # chez Apple : fastlane fait ce pont, puis regenere le profil pour que
      # le build du jour couvre les appareils enregistres depuis le dernier.
      - name: Register tester devices and refresh the Ad Hoc profile
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          TESTER_UDIDS_FILE: ${{ runner.temp }}/tester-udids.tsv
          PROFILE_OUTPUT_DIR: ${{ runner.temp }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "::error::Cle App Store Connect manquante (APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY). Voir le README."
            exit 1
          fi

          bundle exec fastlane ios refresh_adhoc_profile

      - name: Configure signing for the archive
        run: |
          PP_PATH="$RUNNER_TEMP/questbook_adhoc.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          TEAM_ID="$TEAM_ID" PROFILE_NAME="$PROFILE_NAME" EXPORT_OPTIONS="$EXPORT_OPTIONS" \
            python3 -c "import os,plistlib; plistlib.dump({'method':'ad-hoc','teamID':os.environ['TEAM_ID'],'signingStyle':'manual','compileBitcode':False,'provisioningProfiles':{'com.questbook.questbook':os.environ['PROFILE_NAME']}}, open(os.environ['EXPORT_OPTIONS'],'wb'))"

          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          # flutter build ipa treats args after `--` as a target file, not as
          # xcodebuild settings. The Release xcconfig is what Xcode actually
          # reads during the archive.
          {
            echo "CODE_SIGN_STYLE=Manual"
            echo "DEVELOPMENT_TEAM=${TEAM_ID}"
            echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
          } >> ios/Flutter/Release.xcconfig

      - name: Build release IPA
        run: |
          flutter build ipa --release \
            --export-options-plist="$EXPORT_OPTIONS" \
            --dart-define=QUESTBOOK_API_URL="$QUESTBOOK_API_URL" \
            --dart-define=QUESTBOOK_GOOGLE_SERVER_CLIENT_ID="$QUESTBOOK_GOOGLE_SERVER_CLIENT_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Clean up keychain and signing files
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" \
                "$RUNNER_TEMP/questbook_adhoc.mobileprovision" \
                "$RUNNER_TEMP/tester-udids.tsv"

  distribute:
    name: Distribute and tag
    needs: [version, android, ios]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute Android to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: |
          firebase appdistribution:distribute \
            dist/android/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "testeurs" \
            --release-notes "$RELEASE_NOTES" \
            --token "$FIREBASE_TOKEN"

      - name: Distribute iOS to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: |
          ipa=$(ls dist/ios/*.ipa | head -n1)
          firebase appdistribution:distribute \
            "$ipa" \
            --app "$FIREBASE_IOS_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            --groups "testeurs" \
            --release-notes "$RELEASE_NOTES" \
            --token "$FIREBASE_TOKEN"

      # Pose apres coup : un build qui echoue ne doit pas bruler son numero.
      - name: Tag the distributed version
        run: |
          version="${{ needs.version.outputs.value }}"
          # Un tag annote porte un auteur, et un runner neuf n'en a aucun : sans
          # ces deux lignes, git refuse de le creer.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Distribue aux testeurs le $(date -u +%Y-%m-%d)"
          git push origin "v$version"
