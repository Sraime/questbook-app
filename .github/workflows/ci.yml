name: CI

# Garde-fou avant merge : la distribution vers les testeurs se declenche des
# qu'une PR tombe dans `main`, donc ce qui est rouge ici ne doit jamais y
# arriver. Egalement sur les pushes de `dev`, la branche de travail.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  check:
    name: Analyse et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Les tests de migration Drift ouvrent une vraie base SQLite via le
      # paquet `sqlite3`, qui charge la bibliotheque systeme.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      # Le projet est a zero avertissement : le garder ainsi coute moins cher
      # que de le nettoyer plus tard.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
